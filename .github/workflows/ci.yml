name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: eight-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare the self-hosted runner for setup-ruby
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential git libyaml-dev libffi-dev libssl-dev zlib1g-dev libgmp-dev libpq-dev pkg-config
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: eight-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare the self-hosted runner for setup-ruby
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential git libyaml-dev libffi-dev libssl-dev zlib1g-dev libgmp-dev libpq-dev pkg-config
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: eight-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare the self-hosted runner for setup-ruby
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential git libyaml-dev libffi-dev libssl-dev zlib1g-dev libgmp-dev libpq-dev pkg-config
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: eight-amd64

    # services:
    #  redis:
    #    image: redis
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare the self-hosted runner for setup-ruby
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential git libyaml-dev libffi-dev libssl-dev zlib1g-dev libgmp-dev libpq-dev pkg-config
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install Chrome's shared libraries
        run: sudo apt-get install --yes --no-install-recommends libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libexpat1 libgbm1 libglib2.0-0t64 libnss3 libpango-1.0-0 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2

      - name: Install Chrome for the system tests
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Put Chrome where Selenium looks for it
        run: sudo ln -sf "${{ steps.chrome.outputs.chrome-path }}" /usr/bin/google-chrome

      - name: Run tests
        env:
          RAILS_ENV: test
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
